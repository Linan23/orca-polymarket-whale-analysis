name: Research finding
description: Propose a candidate result for independent evidence and claim review.
title: "[Finding]: "
labels:
  - research-finding
body:
  - type: textarea
    id: claim
    attributes:
      label: Candidate claim
      description: Use association or predictive language, not unsupported causal language.
    validations:
      required: true
  - type: input
    id: dataset
    attributes:
      label: Dataset version and hash
    validations:
      required: true
  - type: input
    id: experiment
    attributes:
      label: Experiment ID and commit SHA
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Metric, uncertainty, and sample size
      description: Include fold/seed-level variability and the comparison baseline.
    validations:
      required: true
  - type: textarea
    id: robustness
    attributes:
      label: Robustness and limitations
      description: Summarize temporal, category, liquidity, and cold-start checks.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction command and generated artifacts
    validations:
      required: true
  - type: checkboxes
    id: review
    attributes:
      label: Review requirements
      options:
        - label: A tester reproduced the result from a clean environment.
          required: true
        - label: A reviewer confirmed the wording matches the evidence.
          required: true
        - label: Negative or inconclusive evidence is disclosed.
          required: true
